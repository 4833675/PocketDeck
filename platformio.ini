[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/embed_ssh_key.py
board_build.filesystem = littlefs
board_build.partitions = partitions_8mb.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LibSSH-ESP32 treats a failed socket read-buffer allocation as EOF.
    ; Keep each read small enough for the Cardputer Adv's fragmented no-PSRAM heap.
    -DMAX_BUF_SIZE=1024
lib_deps =
    m5stack/M5Unified @ 0.2.17
    m5stack/M5Cardputer @ 1.1.1
    h2zero/NimBLE-Arduino @ 1.4.3
    https://github.com/m5stack/TinyGPSPlus.git
    bblanchon/ArduinoJson @ 7.4.3
    ewpa/LibSSH-ESP32 @ 5.9.0
    jgromes/RadioLib @ 7.7.1
    https://github.com/earlephilhower/ESP8266Audio.git#2.2.0
